name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # AGP 9.4 requires a Java 25 toolchain. Running Gradle itself on JDK 25 is
      # enough — Gradle always treats the JVM running the build as an installed
      # toolchain, so no gradle.properties entry is needed for it.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # The ubuntu runner images ship the Android SDK with the licenses already
      # accepted, and AGP downloads anything else it needs (platform 37,
      # build-tools 36.0.0) through its own SDK auto-download.
      #
      # This step used to call `sdkmanager --install` explicitly. That call always
      # failed, because the sdkmanager preinstalled on the runner is too old to
      # parse the current SDK repository. It was harmless — AGP fetched the
      # packages anyway — but keeping the job alive needed an `|| true`, which
      # made this step's "success" meaningless. So it is gone. Re-accepting the
      # licenses is cheap insurance, and `continue-on-error` means a failure here
      # is recorded honestly instead of being swallowed.
      - name: Accept Android SDK licenses
        continue-on-error: true
        run: yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The wrapper's executable bit is not always preserved when the repo is
      # committed from Windows, so do not rely on it.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Printed up front so a failure report immediately shows which JDK and
      # Gradle actually ran.
      - name: Print toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
