name: Release

# Pushing a version tag builds the R8-minified release APK and attaches it to a
# GitHub Release, so the APK can be downloaded straight onto a phone and
# sideloaded — no cable, no adb.
#
#   git tag -a v1.0 -m "v1.0"
#   git push origin v1.0
#
# Before the first release, add the four signing secrets (Settings → Secrets and
# variables → Actions). Without them the build still succeeds, but the APK is
# signed with a throwaway debug key and users cannot upgrade in place:
#
#   APPALARM_KEYSTORE_BASE64     base64 of your .jks
#   APPALARM_KEYSTORE_PASSWORD
#   APPALARM_KEY_ALIAS
#   APPALARM_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # AGP 9.4 requires a Java 25 toolchain; running Gradle on JDK 25 is enough.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # The runner images ship the SDK with licenses already accepted, and AGP
      # fetches everything else itself. See the note in ci.yml for why there is
      # no explicit sdkmanager --install step.
      - name: Accept Android SDK licenses
        continue-on-error: true
        run: yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Signing is only configured when the repository secrets exist. Expose them
      # as the environment variables app/build.gradle.kts looks for.
      # Signing is only configured when the repository secrets exist. Expose them
      # as the environment variables app/build.gradle.kts looks for.
      #
      # Every value is stripped of CR/LF first. A secret pasted out of a file
      # frequently carries a trailing newline, and GITHUB_ENV cannot represent a
      # multiline value — the password would be silently truncated and Gradle
      # would later fail with a message that never mentions which secret is wrong.
      - name: Prepare release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.APPALARM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APPALARM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APPALARM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APPALARM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "$1" | tr -d '\r\n'; }

          if [ -z "$(strip "${KEYSTORE_BASE64:-}")" ]; then
            echo "::warning::APPALARM_KEYSTORE_BASE64 is not set — this APK will be signed with a throwaway debug key, so it cannot be installed over a build signed with a different key."
            exit 0
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          strip "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          echo "decoded keystore: $(stat -c%s "$KEYSTORE_FILE") bytes"

          {
            echo "APPALARM_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "APPALARM_KEYSTORE_PASSWORD=$(strip "$KEYSTORE_PASSWORD")"
            echo "APPALARM_KEY_ALIAS=$(strip "$KEY_ALIAS")"
            echo "APPALARM_KEY_PASSWORD=$(strip "$KEY_PASSWORD")"
          } >> "$GITHUB_ENV"

      # Check the credentials here, not deep inside Gradle. A wrong password or a
      # wrong alias makes AGP fail while packaging with a message that does not
      # say which secret is at fault; keytool says it plainly.
      - name: Verify the signing keystore
        if: env.APPALARM_KEYSTORE_FILE != ''
        run: |
          set -euo pipefail
          echo "alias: $APPALARM_KEY_ALIAS"
          "$JAVA_HOME/bin/keytool" -list -v \
            -keystore "$APPALARM_KEYSTORE_FILE" \
            -storepass "$APPALARM_KEYSTORE_PASSWORD" \
            -alias "$APPALARM_KEY_ALIAS" > /dev/null
          echo "::notice::signing keystore and credentials verified"

      # Never ship an APK whose tests did not pass.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-release.log

      # GitHub's job-log download endpoint requires admin rights on the repo (it
      # answers 403 to an anonymous request even for a public repo), so a failed
      # run is otherwise a black box to anyone but the owner. Emit the Gradle
      # error as an annotation instead — the annotations API *is* public.
      - name: Surface the build failure
        if: failure()
        run: |
          REPORT="$(sed -n '/What went wrong/,/^\* Try:/p' /tmp/gradle-release.log | head -30 | tr '\n' ' ' | tr -s ' ')"
          if [ -z "$REPORT" ]; then
            REPORT="$(grep -m 10 -i -E 'error|failed|cannot|not found|no such' /tmp/gradle-release.log | tr '\n' ' ')"
          fi
          echo "::error title=Gradle failure::${REPORT:0:60000}"

      - name: Show what will be published
        run: ls -l app/build/outputs/apk/release/

      # `gh` is preinstalled on the runners, which avoids pulling in another
      # third-party action — the android-actions/setup-android failure was a
      # reminder of why that matters.
      #
      # Release notes are hand-written per version in docs/release-notes/<tag>.md
      # when that file exists, and otherwise generated from the commit list.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="app/build/outputs/apk/release/app-release.apk"
          NOTES="docs/release-notes/${TAG}.md"
          test -f "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-running a tag (e.g. after deleting and re-pushing it) updates the
            # existing release instead of failing.
            gh release upload "$TAG" "$APK" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "$TAG" --generate-notes
          fi
